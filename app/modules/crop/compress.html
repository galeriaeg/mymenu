<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compressão de Imagem no Navegador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos personalizados para a fonte Inter */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
        <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">Comprimir Imagem (Cliente)</h2>

        <div class="mb-4">
            <label for="imageInput" class="block text-gray-700 text-sm font-semibold mb-2">Selecione a Imagem:</label>
            <input type="file" id="imageInput" accept="image/*" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="mb-6">
            <label for="qualityInput" class="block text-gray-700 text-sm font-semibold mb-2">Qualidade da Compressão (0.1 - 1.0):</label>
            <input type="number" id="qualityInput" value="0.7" min="0.1" max="1.0" step="0.1" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <p class="text-xs text-gray-500 mt-1">Valores menores resultam em mais compressão (menor qualidade).</p>
        </div>

        <div id="messageArea" class="bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded relative mb-6 hidden" role="alert">
            <strong class="font-bold">Informações:</strong>
            <span id="messageText" class="block sm:inline"></span>
        </div>

        <button id="compressButton" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75 transition duration-300 ease-in-out transform hover:scale-105">
            Comprimir e Enviar Imagem
        </button>

        <div class="mt-8 text-center">
            <h3 class="text-xl font-semibold text-gray-700 mb-4">Imagem Comprimida:</h3>
            <img id="compressedImage" src="https://placehold.co/300x200/cccccc/ffffff?text=Imagem+Comprimida" alt="Imagem Comprimida" class="max-w-full h-auto rounded-md shadow-md mx-auto border border-gray-200">
            <p id="imageSizeInfo" class="text-gray-600 text-sm mt-2"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@latest/dist/browser-image-compression.js"></script>

    <script>
        // Obtém referências para os elementos HTML
        const imageInput = document.getElementById('imageInput');
        const qualityInput = document.getElementById('qualityInput');
        const compressButton = document.getElementById('compressButton');
        const compressedImage = document.getElementById('compressedImage');
        const imageSizeInfo = document.getElementById('imageSizeInfo');
        const messageArea = document.getElementById('messageArea');
        const messageText = document.getElementById('messageText');

        // Adiciona um ouvinte de evento ao botão de compressão
        compressButton.addEventListener('click', async () => {
            // Verifica se um arquivo foi selecionado
            const file = imageInput.files[0];
            if (!file) {
                showMessage('Por favor, selecione uma imagem primeiro.', 'error');
                return;
            }

            // Obtém a qualidade de compressão do input
            const quality = parseFloat(qualityInput.value);
            if (isNaN(quality) || quality < 0.1 || quality > 1.0) {
                showMessage('Qualidade inválida. Use um valor entre 0.1 e 1.0.', 'error');
                return;
            }

            // Configura as opções de compressão
            const options = {
                maxSizeMB: 10, // Tamanho máximo em MB (opcional, se a imagem for maior, será comprimida)
                maxWidthOrHeight: 1920, // Largura ou altura máxima (opcional)
                useWebWorker: true, // Usa Web Workers para melhor desempenho em imagens grandes
                maxIteration: 10, // Número máximo de iterações de compressão
                initialQuality: quality, // Qualidade inicial (0.1 a 1.0)
                fileType: 'image/jpeg' // Tipo de arquivo de saída, forçando JPEG para compressão
            };

            try {
                showMessage('Comprimindo imagem...', 'info');
                // Chama a função de compressão da biblioteca
                const compressedFile = await imageCompression(file, options);

                // Exibe informações de tamanho
                const originalSizeKB = (file.size / 1024).toFixed(2);
                const compressedSizeKB = (compressedFile.size / 1024).toFixed(2);
                imageSizeInfo.textContent = `Tamanho Original: ${originalSizeKB} KB | Tamanho Comprimido: ${compressedSizeKB} KB`;

                // Cria uma URL para o blob da imagem comprimida e a exibe
                const reader = new FileReader();
                reader.onload = (event) => {
                    compressedImage.src = event.target.result;
                    showMessage('Imagem comprimida com sucesso! Enviando para o servidor...', 'success');
                };
                reader.readAsDataURL(compressedFile);

                // --- Parte de envio para o servidor PHP ---
                const formData = new FormData();
                // O nome do campo 'compressedImage' deve corresponder ao que o PHP espera em $_FILES
                formData.append('compressedImage', compressedFile, compressedFile.name);

                // IMPORTANTE: Este arquivo HTML e o script PHP (upload_compressed_image.php)
                // DEVEM ser executados a partir de um servidor web (Apache, Nginx, ou o servidor embutido do PHP).
                // Abrir o arquivo HTML diretamente no navegador (file://) causará erros de segurança.
                const response = await fetch('/upload_compressed_image.php', { // Usar caminho absoluto a partir da raiz do servidor
                    method: 'POST',
                    body: formData,
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        showMessage('Imagem comprimida e enviada com sucesso! Caminho no servidor: ' + result.filePath, 'success');
                    } else {
                        showMessage('Erro ao enviar imagem: ' + result.message, 'error');
                    }
                } else {
                    showMessage('Erro na requisição de upload: ' + response.statusText, 'error');
                }
                // --- Fim da parte de envio ---

            } catch (error) {
                console.error('Erro ao comprimir ou enviar imagem:', error);
                showMessage('Erro ao comprimir ou enviar imagem: ' + error.message, 'error');
                compressedImage.src = "https://placehold.co/300x200/ff0000/ffffff?text=Erro"; // Placeholder de erro
            }
        });

        /**
         * Exibe uma mensagem na área de mensagens.
         * @param {string} message O texto da mensagem.
         * @param {'info'|'success'|'error'} type O tipo da mensagem para estilização.
         */
        function showMessage(message, type) {
            messageArea.classList.remove('hidden', 'bg-blue-100', 'bg-green-100', 'bg-red-100', 'border-blue-400', 'border-green-400', 'border-red-400', 'text-blue-700', 'text-green-700', 'text-red-700');
            messageArea.classList.add('block');
            messageText.textContent = message;

            switch (type) {
                case 'info':
                    messageArea.classList.add('bg-blue-100', 'border-blue-400', 'text-blue-700');
                    break;
                case 'success':
                    messageArea.classList.add('bg-green-100', 'border-green-400', 'text-green-700');
                    break;
                case 'error':
                    messageArea.classList.add('bg-red-100', 'border-red-400', 'text-red-700');
                    break;
            }
        }
    </script>
</body>
</html>
